<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jonathan - Estudiante de Ingeniería Electrónica, UTP Pereira">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#16243a"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
    .trace{fill:none;stroke:#1f3d66;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:none;stroke:#ff4757;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70 930;stroke-dashoffset:1000;animation:run 3.6s linear infinite}
    .d1{animation-delay:.4s}.d2{animation-delay:1.1s}.d3{animation-delay:1.8s}.d4{animation-delay:2.5s}.d5{animation-delay:3s}
    @keyframes run{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
    .pad{fill:#0b0f17;stroke:#4aa3ff;stroke-width:2.5}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .led{animation:led 1.6s ease-in-out infinite}
    @keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <!-- fondo -->
  <rect width="1200" height="300" rx="14" fill="#0b0f17"/>
  <rect width="1200" height="300" rx="14" fill="url(#dots)"/>

  <!-- pistas del circuito -->
  <g class="trace">
    <path pathLength="1000" d="M1080 110 H1120 L1150 80 V0"/>
    <path pathLength="1000" d="M1080 140 H1200"/>
    <path pathLength="1000" d="M1080 170 H1130 L1160 200 V300"/>
    <path pathLength="1000" d="M930 110 H880 L850 80 H780 V0"/>
    <path pathLength="1000" d="M930 140 H810"/>
    <path pathLength="1000" d="M930 170 H870 L840 200 H760"/>
    <path pathLength="1000" d="M930 200 H895 V262 H700 L680 282 H560"/>
    <path pathLength="1000" d="M960 215 V250 H925 V300"/>
    <path pathLength="1000" d="M1005 215 V300"/>
    <path pathLength="1000" d="M1050 215 V245 H1100 L1130 275 H1200"/>
  </g>

  <!-- señales viajando -->
  <g filter="url(#redglow)">
    <path class="pulse" pathLength="1000" d="M1200 140 H1080"/>
    <path class="pulse d2" pathLength="1000" d="M780 0 V80 H850 L880 110 H930"/>
    <path class="pulse d1" pathLength="1000" d="M560 282 H680 L700 262 H895 V200 H930"/>
    <path class="pulse d3" pathLength="1000" d="M1005 300 V215"/>
    <path class="pulse d4" pathLength="1000" d="M1150 0 V80 L1120 110 H1080"/>
    <path class="pulse d5" pathLength="1000" d="M760 200 H840 L870 170 H930"/>
  </g>

  <!-- pads -->
  <g>
    <circle class="pad" cx="810" cy="140" r="6"/>
    <circle class="pad" cx="760" cy="200" r="6"/>
    <circle class="pad" cx="560" cy="282" r="6"/>
    <circle class="pad" cx="780" cy="22" r="5"/>
    <circle class="pad" cx="1150" cy="22" r="5"/>
  </g>

  <!-- chip ESP32 -->
  <g>
    <rect x="930" y="70" width="150" height="145" rx="6" fill="#0f1826" stroke="#4aa3ff" stroke-width="2.5"/>
    <!-- antena -->
    <path d="M945 92 h20 v-10 h12 v10 h12 v-10 h12 v10 h12 v-10 h12 v10 h28" fill="none" stroke="#2c5a92" stroke-width="2"/>
    <rect x="945" y="104" width="120" height="96" rx="4" fill="#121e30" stroke="#1f3d66" stroke-width="1.5"/>
    <text x="1005" y="145" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#cfe3ff">ESP32</text>
    <text x="1005" y="168" text-anchor="middle" class="mono" font-size="11" fill="#5b7aa3">WROOM-32</text>
    <circle class="led" cx="1050" cy="188" r="4" fill="#ff4757" filter="url(#redglow)"/>
    <!-- pines -->
    <g fill="#4aa3ff">
      <rect x="922" y="106" width="8" height="8" rx="1"/><rect x="922" y="136" width="8" height="8" rx="1"/>
      <rect x="922" y="166" width="8" height="8" rx="1"/><rect x="922" y="196" width="8" height="8" rx="1"/>
      <rect x="1080" y="106" width="8" height="8" rx="1"/><rect x="1080" y="136" width="8" height="8" rx="1"/>
      <rect x="1080" y="166" width="8" height="8" rx="1"/>
      <rect x="956" y="215" width="8" height="8" rx="1"/><rect x="1001" y="215" width="8" height="8" rx="1"/>
      <rect x="1046" y="215" width="8" height="8" rx="1"/>
    </g>
  </g>

  <!-- texto -->
  <text x="60" y="72" class="mono" font-size="18" xml:space="preserve"><tspan fill="#ff4757">soros6999@pereira</tspan><tspan fill="#c9d6e8">:</tspan><tspan fill="#4aa3ff">~</tspan><tspan fill="#c9d6e8">$ ./hola.sh</tspan></text>
  <text x="56" y="152" class="mono" font-size="68" font-weight="800" fill="#e6f1ff" filter="url(#glow)" letter-spacing="4">JONATHAN</text>
  <rect class="cur" x="420" y="104" width="30" height="54" fill="#ff4757"/>
  <text x="60" y="196" class="mono" font-size="21" fill="#4aa3ff">Estudiante de Ingeniería Electrónica</text>
  <text x="60" y="228" class="mono" font-size="16" fill="#6c84a6">UTP · Pereira, Colombia · Python · MicroPython · ESP32</text>

  <!-- efecto retro -->
  <rect width="1200" height="300" rx="14" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="298" rx="13" fill="none" stroke="#1f3d66" stroke-width="2"/>
</svg>
